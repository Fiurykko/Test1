<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Vocaboli — English Practice</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1><a href="index.html">English Practice</a></h1>
    <nav class="main-nav">
      <a href="flashcards.html">Vocaboli</a>
      <a href="quiz.html">Quiz</a>
      <a href="grammar.html">Grammatica</a>
    </nav>
  </header>

  <main>
    <h2>Flashcard vocaboli</h2>
    <p class="subtitle">Clicca la carta per girarla. Poi segna se la sapevi o se vuoi rivederla.</p>

    <div class="level-filter" id="levelFilter"></div>

    <div class="level-filter" id="modeFilter">
      <button data-mode="all" class="active">Tutte</button>
      <button data-mode="new">Solo nuove</button>
      <button data-mode="review">Da ripassare</button>
    </div>

    <div class="progress" id="progress"></div>

    <div id="cardArea"></div>

    <div class="actions" id="actions" style="display:none;">
      <button class="btn success" id="knowBtn">✓ Sapevo</button>
      <button class="btn ghost" id="skipBtn">Salta →</button>
      <button class="btn error" id="reviewBtn">Da ripassare</button>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/flashcards.js"></script>
</body>
</html>
